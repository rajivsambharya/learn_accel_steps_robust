# all runs share one data setup (data_setup_copied hash 75b4e6dd); method names
# match the columns the paper's nnls table reads
methods:
  # vanilla (nesterov), nearest neighbor and line search: baseline columns of a run
  # evaluated for 200 iterations (same problems; its nesterov curve matches the
  # lambda = 0.1 run's), so they are not cut off at the 50-iteration eval horizon
  nesterov: 2026-10-08/14-12-26 #2026-10-04/18-13-43
  nearest_neighbor: 2026-10-08/14-12-26 #2026-10-04/18-13-43
  backtracking: 2026-10-08/14-12-26
  # lah (no acceleration)
  learned_no_accel: 2026-09-29/09-27-35
  # lah accel, no robustness (pep lambda = 0, same 200 epochs / settings as the ablation)
  lah_accel: 2026-10-04/19-40-02
  # lah accel robust: pep lambda = 0.1 ablation run (pep_target 0.9, polished, gamma = 0.898)
  lah_accel_1: 2026-10-04/18-13-43
  # l2ws: caution -- these ran on a different data setup (hash dc433837), so they
  # are not evaluated on the same problems as the runs above, and stopped early
  l2ws: 2026-10-15/09-08-21 # N_train = 10, stopped at epoch 250 of 2000
  l2ws10000: 2026-10-15/08-35-44 # N_train = 10000, stopped at epoch 100 of 2000
num_iters: 20
step_size_iters: 20
# left off obj_diff_test.pdf but kept in the tables
plot_exclude: ['l2ws10000']

