# larger example: m_orig=1000, n_orig=2000 (all runs share the same data setup)
# method names match the columns the paper's sparse coding table reads
methods:
  # baselines (the no_train column of an accel run is fista)
  nesterov: 2026-10-10/17-23-01
  nearest_neighbor: 2026-10-10/17-23-01
  backtracking: 2026-10-10/17-23-01
  # lah accel with no pep penalty (no robustness, gamma = inf)
  lah_accel: 2026-10-10/12-18-28 #2026-10-10/14-08-00
  # lah accel with the pep penalty (lambda = 0.1, pep_target = 0.1) + robustness polish
  lah_accel_1: 2026-10-10/18-47-35 #2026-10-10/17-23-01 (lambda = 0.01)
  # lah without acceleration: no safeguard / safeguarded
  learned_no_accel: 2026-10-15/12-17-55
  learned_no_accel_safeguard: 2026-10-15/11-42-31
  l2ws: 2026-10-16/10-57-04 # N_train = 10, stopped at epoch 350 of 2000
  l2ws10000: 2026-10-16/10-59-40 # N_train = 10000, stopped at epoch 100 of 2000
  lista: 2026-10-15/21-57-36 # N_train = 10, stopped at epoch 100 of 4000
  lista10000: 2026-10-15/20-51-00 # N_train = 10000, stopped at epoch 50 of 4000
num_iters: 31
step_size_iters: 30
# in the table but not the plots (the paper's sparse coding figures have no
# l2ws / lista curves; l2ws and lista are always left off)
plot_exclude: ['l2ws10000', 'lista10000']

